name: Build and publish deploy branch

# Builds the Expo web bundle and force-pushes ONLY the built files to a
# `deploy` branch. Hostinger's built-in GIT integration pulls from that
# branch into the lucidwinds.com/barbrawl/ folder. No SSH, no passwords,
# no per-environment secrets needed — Hostinger authenticates itself.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the `deploy` branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: apps/mobile
        run: pnpm build:web

      - name: Copy web/.htaccess into dist
        run: cp apps/mobile/web/.htaccess apps/mobile/dist/.htaccess

      - name: Disable Jekyll on GitHub Pages
        # GitHub Pages defaults to Jekyll, which silently drops any folder
        # whose name starts with an underscore. Our Expo bundle lives in
        # `_expo/`, so without this marker the JS 404s.
        run: touch apps/mobile/dist/.nojekyll

      - name: SPA fallback for GitHub Pages (404.html = index.html)
        # GitHub Pages ignores our .htaccess (it's not Apache), so deep links
        # and refreshes on any non-root route (/map, /preview, ...) 404. Pages'
        # convention is to serve 404.html for unknown paths — make it a copy of
        # index.html so the expo-router SPA boots and handles the route.
        run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html

      - name: Force-push dist to deploy branch
        env:
          DIST: apps/mobile/dist
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Configure git identity for the orphan commit.
          git config --global user.name "barbrawl-deploy-bot"
          git config --global user.email "deploy@barbrawl"

          # Stamp the build with the source commit it came from so a
          # human inspecting the deploy branch can trace it back.
          echo "Built from main@$SOURCE_SHA at $(date -u +%FT%TZ)" > "$DIST/.build-info"

          # Carry forward the PREVIOUS deploy's JS bundle. GitHub Pages caches
          # index.html for ~10 min and ignores our .htaccess, so right after a
          # deploy a visitor can hold a stale index.html that points at the old
          # (hashed) bundle. If we wiped that bundle, the app can't boot and the
          # page goes dead until the HTML cache expires. By keeping the single
          # previous bundle alive, the stale HTML still loads (old version) and
          # self-heals once the cache refreshes. Bounded to 2 generations so the
          # branch stays small.
          if git fetch --depth=1 origin deploy 2>/dev/null; then
            PREV_BUNDLE=$(git show FETCH_HEAD:index.html 2>/dev/null \
              | grep -oE '_expo/static/js/web/[^"]+\.js' | head -1 || true)
            if [ -n "$PREV_BUNDLE" ] && [ ! -f "$DIST/$PREV_BUNDLE" ]; then
              mkdir -p "$DIST/$(dirname "$PREV_BUNDLE")"
              git show "FETCH_HEAD:$PREV_BUNDLE" > "$DIST/$PREV_BUNDLE" 2>/dev/null \
                && echo "Carried forward previous bundle: $PREV_BUNDLE" \
                || rm -f "$DIST/$PREV_BUNDLE"
            fi
          fi

          # Create an orphan branch (no history) so deploy branch stays small.
          cd "$DIST"
          git init -q -b deploy
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Force-add the .htaccess even if it's covered by some upstream gitignore.
          git add -Af .
          git commit -q -m "Deploy from main@$SOURCE_SHA"
          git push -f origin deploy

      - name: Summary
        run: |
          echo "::notice::Deploy branch updated. In Hostinger hPanel → Advanced → GIT, click Deploy to pull this branch into public_html/barbrawl/."
