name: Build and publish deploy branch

# Builds the Expo web bundle and force-pushes ONLY the built files to a
# `deploy` branch. Hostinger's built-in GIT integration pulls from that
# branch into the lucidwinds.com/barbrawl/ folder. No SSH, no passwords,
# no per-environment secrets needed — Hostinger authenticates itself.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the `deploy` branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: apps/mobile
        run: pnpm build:web

      - name: Copy web/.htaccess into dist
        run: cp apps/mobile/web/.htaccess apps/mobile/dist/.htaccess

      - name: Disable Jekyll on GitHub Pages
        # GitHub Pages defaults to Jekyll, which silently drops any folder
        # whose name starts with an underscore. Our Expo bundle lives in
        # `_expo/`, so without this marker the JS 404s.
        run: touch apps/mobile/dist/.nojekyll

      - name: Force-push dist to deploy branch
        env:
          DIST: apps/mobile/dist
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Configure git identity for the orphan commit.
          git config --global user.name "barbrawl-deploy-bot"
          git config --global user.email "deploy@barbrawl"

          # Stamp the build with the source commit it came from so a
          # human inspecting the deploy branch can trace it back.
          echo "Built from main@$SOURCE_SHA at $(date -u +%FT%TZ)" > "$DIST/.build-info"

          # Create an orphan branch (no history) so deploy branch stays small.
          cd "$DIST"
          git init -q -b deploy
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Force-add the .htaccess even if it's covered by some upstream gitignore.
          git add -Af .
          git commit -q -m "Deploy from main@$SOURCE_SHA"
          git push -f origin deploy

      - name: Summary
        run: |
          echo "::notice::Deploy branch updated. In Hostinger hPanel → Advanced → GIT, click Deploy to pull this branch into public_html/barbrawl/."
